name: Events Demo

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this?'
        required: false
        default: 'learning'

  schedule:
    - cron: '30 3 * * 1-5'

jobs:
  show-event:
    runs-on: ubuntu-latest

    steps:
      - name: Print event details
        run: |
          echo "Event name : ${{ github.event_name }}"
          echo "Branch/ref : ${{ github.ref }}"
          echo "Actor      : ${{ github.actor }}"
          echo "Reason     : ${{ inputs.reason }}"
